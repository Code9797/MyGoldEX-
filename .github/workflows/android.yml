name: Generer APK MyGoldEX

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - generate_project.py
      - .github/workflows/android.yml

permissions:
  contents: read

concurrency:
  group: mygoldex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Tests et APK Android
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Installer les composants Android
        uses: android-actions/setup-android@v3
        with:
          log-accepted-android-sdk-licenses: false
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Generer le projet Android
        run: python3 generate_project.py

      - name: Generer le Gradle Wrapper officiel
        working-directory: generated/MyGoldEX
        run: gradle wrapper --gradle-version 8.11.1 --distribution-type bin --no-daemon

      - name: Tester et compiler
        working-directory: generated/MyGoldEX
        run: bash ./gradlew :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon --stacktrace

      - name: Verifier la signature et preparer APK
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose \
            generated/MyGoldEX/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp generated/MyGoldEX/app/build/outputs/apk/debug/app-debug.apk artifacts/MyGoldEX.apk

      - name: Fournir APK
        uses: actions/upload-artifact@v4
        with:
          name: MyGoldEX-APK
          path: artifacts/MyGoldEX.apk
          if-no-files-found: error
          retention-days: 14

      - name: Telecharger MT5 depuis le lien officiel
        run: |
          python3 generated/MyGoldEX/ci/download_mt5.py
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging mt5.apk > evidence/mt5-package.txt
          python3 -c 'from pathlib import Path; assert "package: name='"'"'net.metaquotes.metatrader5'"'"'" in Path("evidence/mt5-package.txt").read_text()'

      - name: Activer KVM sur le runner
        run: sudo chmod 666 /dev/kvm

      - name: Verifier la superposition sur MT5 Android 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: bash generated/MyGoldEX/ci/test_mt5.sh

      - name: Fournir les preuves du test MT5
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: MyGoldEX-MT5-Verification
          path: evidence/
          if-no-files-found: warn
          retention-days: 14

      - name: Fournir les sources Android
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: MyGoldEX-Sources-Android
          include-hidden-files: true
          path: |
            generated/MyGoldEX/*.kts
            generated/MyGoldEX/gradle.properties
            generated/MyGoldEX/.gitignore
            generated/MyGoldEX/README.md
            generated/MyGoldEX/gradlew
            generated/MyGoldEX/gradlew.bat
            generated/MyGoldEX/gradle/wrapper/
            generated/MyGoldEX/app/build.gradle.kts
            generated/MyGoldEX/app/src/
            generated/MyGoldEX/examples/
            generated/MyGoldEX/ci/
          if-no-files-found: warn
          retention-days: 14

      - name: Fournir les rapports de tests
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: MyGoldEX-Tests
          path: |
            generated/MyGoldEX/app/build/reports/tests/
            generated/MyGoldEX/app/build/test-results/
            generated/MyGoldEX/app/build/reports/androidTests/
            generated/MyGoldEX/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
          retention-days: 14
